<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital - Tortas Mom</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Personalización de la imagen de fondo */
    body {
      background-image: url('./assets/background.jpeg');
      background-size: cover;
      background-position: center;
    }

    /* Efecto cristal (Glassmorphism) */
    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center py-10 px-4">

  <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl text-center border border-white/50 relative">

    <div class="mb-6 relative inline-block">
      <div class="inline-block mx-auto rounded-xl p-1 bg-gradient-to-tr from-orange-400 to-red-600">
        <img
          src="./assets/logo.jpeg"
          alt="Foto Tortas Mom" class="max-w-40 h-auto rounded-lg border-4 border-white">
      </div>
      <span
        class="absolute bottom-2 right-2 bg-green-500 w-5 h-5 rounded-full border-2 border-white animate-pulse"></span>
    </div>

    <h1 class="text-2xl font-bold text-gray-800 mb-1">Tortas Mom</h1>
    <p class="text-sm text-gray-500 mb-8">La Jefa De Las Tortas</p>

    <div class="space-y-4">

      <a href="./assets/menu.pdf" target="_blank"
        class="flex items-center justify-center w-full py-4 px-6 bg-gray-800 text-white rounded-xl hover:bg-gray-900 transition transform hover:-translate-y-1 shadow-lg font-semibold group">
        <i class="fas fa-file-pdf text-xl mr-3 group-hover:text-red-400 transition"></i>
        Ver Menú Digital
      </a>

      <a href="https://wa.me/+5219999651709?text=Hola,%20quisiera%20hacer%20un%20pedido" target="_blank"
        class="flex items-center justify-center w-full py-4 px-6 bg-green-500 text-white rounded-xl hover:bg-green-600 transition transform hover:-translate-y-1 shadow-lg shadow-green-200 font-semibold text-lg">
        <i class="fab fa-whatsapp text-2xl mr-3"></i>
        Ordena Aquí
      </a>

      <div class="my-6 border-t border-gray-200 w-1/2 mx-auto"></div>

      <a href="https://www.facebook.com/share/17nqHJtM4Z/" target="_blank"
        class="flex items-center justify-center w-full py-3 px-4 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition shadow-md">
        <i class="fab fa-facebook-f mr-2"></i> Facebook
      </a>

    </div>

    <footer class="mt-10 text-xs text-gray-400">
      <p>Tortas Mom</p>
      <p class="mt-1"><i class="fas fa-map-marker-alt"></i> Mérida Yucatán, México</p>
    </footer>

  </div>

</body>

</html>
